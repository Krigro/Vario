<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your VARIO order was successfully placed.">
    <title>Purchase Successful | VARIO</title>

    <link rel="stylesheet" href="../shared/global.css">
    <link rel="stylesheet" href="./success.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    </head>


    <body class="success-page">

        <main class="success-container">

            <section class="success-content" aria-labelledby="success-title">

                <h1 id="success-title">Thank you for your purchase!</h1>
                <p id="success-message" class="success-message" role="status">
                    Your order has been placed successfully.
                </p>

                <div class="success-greeting">
                    <p>Your new favorites will be on their way soon. </p>
                    <p>We hope you love them as much as we do!</p>
                    <p>You will receive an email with order number and details ASAP!</p>
                    <p>Happy shopping,</p>
                </div>

                <p class="success-signature">
                    The VARIO team ♡
                </p>

                <a href="../index.html" class="back-to-shopping">
                    Back to Shopping
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>  
                </a>
            </section>

            <div class="success-brand">
                <a href="../index.html" aria-label="VARIO homepage">
                <img src="../img/vario.png" alt="VARIO logo">
                </a>
            </div>
        </main>
        <script src="./success.js" type="module"></script>
    </body> 
    </html>
